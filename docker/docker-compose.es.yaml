version: '3.4'

# The Docker Hub elasticsearch:5.x images ignore settings passed as environment
# variables, so every setting is passed as an -E flag.
services:
  es01:
    image: elasticsearch:${ES_VERSION:-5.6.16}
    command: >
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment
      || ./bin/elasticsearch-plugin install --batch ingest-attachment;
      exec /docker-entrypoint.sh elasticsearch
      -Enode.name=es01
      -Enode.max_local_storage_nodes=2
      -Ecluster.name=es-docker-cluster
      -Ediscovery.zen.minimum_master_nodes=2
      -Ediscovery.zen.ping.unicast.hosts=es02
      -Epath.repo=/usr/share/elasticsearch/data
      -Enetwork.host=0.0.0.0
      -Eprocessors=1"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    networks:
      - elastic
  es02:
    image: elasticsearch:${ES_VERSION:-5.6.16}
    command: >
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment
      || ./bin/elasticsearch-plugin install --batch ingest-attachment;
      exec /docker-entrypoint.sh elasticsearch
      -Enode.name=es02
      -Enode.max_local_storage_nodes=2
      -Ecluster.name=es-docker-cluster
      -Ediscovery.zen.minimum_master_nodes=2
      -Ediscovery.zen.ping.unicast.hosts=es01
      -Epath.repo=/usr/share/elasticsearch/data
      -Enetwork.host=0.0.0.0
      -Eprocessors=1"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - elastic
volumes:
  esdata:

networks:
  elastic:
    driver: bridge
