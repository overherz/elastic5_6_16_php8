name: 'Continuous integration'
on: ['push', 'pull_request']
jobs:
  cs:
    runs-on: 'ubuntu-24.04'
    name: 'Coding style'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Setup PHP'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '7.4'
          coverage: 'none'
          extensions: 'json, mbstring, tokenizer'
          tools: 'php-cs-fixer:2.19.3'

      - name: 'Check PHP code'
        run: |
          php-cs-fixer fix --diff --dry-run --allow-risky=yes --using-cache=false

  phpunit:
    runs-on: 'ubuntu-24.04'
    name: 'PHPUnit (PHP ${{ matrix.php }}, ES ${{ matrix.elasticsearch }})'
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - php: '7.4'
            elasticsearch: '5.6.16'
          - php: '8.4'
            elasticsearch: '5.6.16'
          - php: '8.5'
            elasticsearch: '5.6.16'
      fail-fast: false
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Setup PHP'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '${{ matrix.php }}'
          coverage: 'none'
          tools: 'pecl, composer:2.10.3'
          extensions: 'curl, json, mbstring, openssl'

      - name: 'Get composer cache directory'
        id: 'composer_cache'
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: 'Cache dependencies'
        uses: 'actions/cache@v4'
        with:
          path: '${{ steps.composer_cache.outputs.dir }}'
          key: '${{ runner.os }}-composer-php${{ matrix.php }}-${{ hashFiles(''**/composer.json'') }}'
          restore-keys: |
            ${{ runner.os }}-composer-php${{ matrix.php }}-
            ${{ runner.os }}-composer-

      # Every aws/aws-sdk-php release that still runs on PHP 7.4 has a security advisory,
      # it is only needed by the AwsAuthV4 transport tests.
      - name: 'Update dependencies'
        run: |
          composer config --json policy.advisories.ignore '["aws/aws-sdk-php"]'
          composer update --prefer-dist --no-interaction --no-progress --ansi ${{ matrix.composer_flags }}

      - name: 'Run unit tests'
        run: |
          vendor/bin/phpunit -c test/ --group unit

      - name: 'Setup Elasticsearch'
        run: |
          sudo swapoff -a
          sudo sysctl -w vm.swappiness=1
          sudo sysctl -w fs.file-max=262144
          sudo sysctl -w vm.max_map_count=262144
          ES_VERSION=${{ matrix.elasticsearch }} docker compose --file=docker/docker-compose.proxy.yaml --file=docker/docker-compose.es.yaml up --detach
          docker run --rm --network=docker_elastic curlimages/curl --max-time 300 --retry-max-time 300 --retry 120 --retry-delay 5 --retry-all-errors --fail --show-error --silent 'http://es01:9200/_cluster/health?wait_for_nodes=2&wait_for_status=green&timeout=60s'

      - name: 'Run functional tests'
        env:
          ELASTICSEARCH_VERSION: "${{ matrix.elasticsearch }}"
        run: |
          vendor/bin/phpunit -c test/ --group functional
